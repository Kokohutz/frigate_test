# Run YOUR local Argus build (builds from source, no upstream image pulled).
#
# Usage:
#   docker compose -f docker-compose.local.yml up --build
#
# First time only — create a config and data directories:
#   mkdir -p config media
#   cp config/config.yml.example config/config.yml
#   # edit config/config.yml to add your cameras
#
# NOTE — SQLite on CIFS/SMB/NFS mounts:
#   SQLite file-locking doesn't work on network filesystems (CIFS, NFS, etc.).
#   If ./config is on a network share, the database WILL corrupt.
#   The `argus-db` named volume below keeps the DB on a local Docker volume
#   (ext4) regardless of where ./config lives.  The path inside the container
#   is /data/db/frigate.db — configured via FRIGATE_DB_PATH.

services:

  argus:
    build:
      context: .
      dockerfile: docker/main/Dockerfile
      target: frigate           # full production target (Python + Rust + web)
    container_name: argus-local
    restart: unless-stopped
    shm_size: "256mb"           # bump to 128 MB × num_cameras for 1080p feeds

    # NOTE: privileged is NOT enabled by default. It is only needed for direct
    # hardware access (Coral USB, iGPU). Prefer the scoped `devices:` /
    # `group_add:` blocks below. Uncomment only if you understand the risk.
    # privileged: true

    ports:
      # ⚠️  Port 5000 is the INTERNAL, UNAUTHENTICATED API. Any request that
      #     reaches it is treated as `remote-role: admin` with no credentials
      #     (see frigate/api/auth.py — the internal-port bypass). NEVER publish
      #     it on a routable interface. It is intentionally NOT mapped here.
      #     If you need the plain-HTTP API for local debugging, bind it to
      #     loopback ONLY by uncommenting the next line:
      # - "127.0.0.1:5000:5000"
      - "8971:8971"     # HTTPS UI + API (auth-gated, self-signed cert)
      - "8554:8554"     # RTSP  (go2rtc)
      - "8555:8555/tcp" # WebRTC TCP  (go2rtc)
      - "8555:8555/udp" # WebRTC UDP  (go2rtc)

    volumes:
      - ./config:/config            # config.yml, model cache, TLS certs
      - ./media:/media/frigate      # recordings, clips, exports
      - argus-db:/data/db           # SQLite on a local volume (safe on CIFS hosts)
      - /etc/localtime:/etc/localtime:ro

    environment:
      # Do NOT set FRIGATE_JWT_SECRET to a hardcoded value. When unset, Frigate
      # generates a strong random secret on first boot and persists it to
      # /config/.jwt_secret. Setting a known value here would let anyone forge
      # admin JWTs. To pin a secret across hosts, use a Docker secret instead.
      FRIGATE_RUST_DISPATCHER: "1"  # route DB writes through Rust comms-dispatcher
      FRIGATE_RUST_CLEANUP: "1"     # Rust owns retention + WAL truncation
      FRIGATE_RUST_RECORD: "1"      # Rust owns recording (storage-daemon)
      # Keeps the SQLite DB on the local argus-db volume instead of /config.
      # Required when ./config is on a CIFS/NFS mount (SQLite locking breaks there).
      FRIGATE_DB_PATH: "/data/db/frigate.db"
      # STORAGE_ENCRYPTION_KEY: "" # uncomment to enable AES-256-GCM at-rest encryption
      # COLD_PATH: ""              # uncomment to enable tiered storage (hot→cold migration)
      # PLUS_API_KEY: ""

    depends_on:
      - mqtt

    # Uncomment for Google Coral USB:
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb

    # Uncomment for Intel iGPU (VAAPI/QSV):
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "109"   # render  (check: getent group render)
    #   - "44"    # video

  mqtt:

    image: eclipse-mosquitto:2.0
    container_name: mqtt-local
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    # argus reaches the broker over the compose network as host "mqtt" — no host
    # port mapping is needed. This broker runs with NO authentication, so it is
    # bound to loopback only to avoid exposing an open broker on the LAN/Internet.
    # Remove this block entirely unless you specifically need host access.
    ports:
      - "127.0.0.1:1883:1883"

volumes:
  argus-db:   # local ext4 volume — SQLite-safe even when ./config is on CIFS/NFS
