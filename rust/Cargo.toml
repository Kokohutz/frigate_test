[workspace]
resolver = "2"
members = [
    "common",
    "storage-daemon",
    "encrypted-storage",
    "tiered-storage",
    "detection-bridge",
    "event-router",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
rand = "0.8"
