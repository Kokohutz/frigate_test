[package]
name = "detection-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Multi-model ONNX inference chain for Frigate, implementing the ZmqIpcDetector wire protocol"

[[bin]]
name = "detection-bridge"
path = "src/main.rs"

[features]
# Enable when ONNX Runtime is installed (set ORT_LIB_LOCATION in Docker build).
# Disabled by default so the workspace builds without ORT being present.
with-onnx = ["ort", "ndarray"]

[dependencies]
frigate-common = { path = "../common" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }

tmq = "0.4"
zmq = "0.10"

# Enabled only when with-onnx feature is active (requires ORT_LIB_LOCATION)
ort = { version = "2.0.0-rc.12", optional = true }
ndarray = { version = "0.15", optional = true }
