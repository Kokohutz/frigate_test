[package]
name = "encrypted-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Transparent AES-256-GCM / ChaCha20-Poly1305 encryption layer for Frigate recordings"

[[bin]]
name = "encrypted-storage"
path = "src/main.rs"

[dependencies]
frigate-common = { path = "../common" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# Encryption
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
# Key derivation
argon2 = "0.5"
# Random nonce generation
rand = { workspace = true }
# SHA-256 for key_id
sha2 = "0.10"

# HTTP server for range-request decrypt-on-read
axum = { version = "0.7", features = ["tokio"] }
tower = "0.4"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
